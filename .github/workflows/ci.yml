name: open-side-ci

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  lint-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck

      - name: Script lint
        run: /bin/bash ./scripts/lint.sh

      - name: Security and manifest verification
        run: /bin/bash ./scripts/ci_verify.sh
